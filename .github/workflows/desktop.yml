name: Windows desktop / prerelease
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar pré-release após compilar
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$releaseVersion" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: SHA-256 e notas
        shell: pwsh
        run: |
          Get-ChildItem release/*-Setup.exe | ForEach-Object { $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item THIRD_PARTY.md release/THIRD_PARTY.md
          Copy-Item desktop/engines.json release/engines.json
      - uses: actions/upload-artifact@v4
        with:
          name: Batatubo-Windows-x64
          path: |
            release/*-Setup.exe
            release/SHA256SUMS.txt
            release/THIRD_PARTY.md
            release/engines.json
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Batatubo-Windows-x64
          path: release
      - name: Publicar como prévia
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --notes-file desktop/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --prerelease --title "Batatubo $RELEASE_TAG / Windows preview" --notes-file desktop/RELEASE_NOTES.md
          fi
